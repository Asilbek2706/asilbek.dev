{% load static %}
{% load compress %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber-Dev | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" rel="stylesheet" />

  {% compress css %}
  <link rel="stylesheet" type="text/x-scss" href="{% static 'scss/style.scss' %}">
  {% endcompress %}
</head>
<body>

<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; background-image: radial-gradient(#ff003c 0.5px, transparent 0.5px); background-size: 30px 30px;"></div>

<main class="page">
  <div class="content-wrap">
    <article class="ck-content">
      {% if homepage %}
      {{ homepage.content|safe }}
      {% else %}
      <p style="text-align: center; color: #ff003c; font-family: 'Fira Code';">>> SYSTEM EMPTY: DATA NOT FOUND <<</p>
      {% endif %}
    </article>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-bash.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.ck-content pre code').forEach((el) => {
      let cls = el.className;
      if (cls.includes('language-code-')) {
        el.className = cls.replace('language-code-', 'language-');
      }
      Prism.highlightElement(el);
    });
  });
</script>
</body>
</html>
